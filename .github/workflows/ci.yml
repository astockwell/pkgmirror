name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    name: Unit tests (no docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  blackbox:
    name: Black-box conformance
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-pull client images in parallel so the test phase's wall time is
      # dominated by actual test work, not image downloads.
      - name: Pre-pull client images
        run: |
          set -euxo pipefail
          images=(
            golang:1.22-bookworm
          )
          for img in "${images[@]}"; do
            docker pull "$img" &
          done
          wait

      - name: Run black-box suite
        env:
          # testcontainers-go uses these to talk to the daemon and tag
          # ephemeral resources.
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: |
          go test -tags=blackbox -timeout=15m -v ./tests/blackbox/...

      - name: Dump docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
          docker images
